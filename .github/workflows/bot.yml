name: Deploy WhatsApp bot

on:
  push:
    branches: [main]
    paths: ["bot/**", "shared/**", ".github/workflows/bot.yml"]
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - name: Typecheck and test
        run: npm run typecheck && npm test
      # deploys only once the Cloudflare secrets are set in the repo (see SETUP.md); until then the tests still run
      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply tote-bot --remote
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
